<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sun-yellow field, not night-black: a dark icon disappears into dark
       browser chrome, which is exactly what happened. Yellow reads on both. -->
  <rect width="64" height="64" rx="14" fill="#fee101" />
  <!-- crescent, bitten out of a disc so it stays crisp at 16px -->
  <circle cx="36" cy="27" r="15" fill="#0a2a18" />
  <circle cx="28" cy="22" r="13" fill="#fee101" />
  <!-- star -->
  <circle cx="15" cy="15" r="2.6" fill="#0a2a18" />
  <!-- shoreline -->
  <line
    x1="10"
    y1="50"
    x2="54"
    y2="50"
    stroke="#e6198a"
    stroke-width="6"
    stroke-linecap="round"
  />
</svg>
